name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever needs to read the checkout.
permissions:
  contents: read

jobs:
  checks:
    name: Lint · test · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (yarn from packageManager)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - run: yarn lint
      - run: yarn test
      - run: yarn typecheck

  android:
    name: Build Android (example)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            example/yarn.lock

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install module dependencies
        run: yarn install --frozen-lockfile
      - name: Install example dependencies
        working-directory: example
        run: yarn install --frozen-lockfile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('example/yarn.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prebuild (android)
        working-directory: example
        run: npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: example/android
        run: ./gradlew assembleDebug -x lint --no-daemon --build-cache

  ios:
    name: Build iOS (example)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            example/yarn.lock

      - name: Install module dependencies
        run: yarn install --frozen-lockfile
      - name: Install example dependencies
        working-directory: example
        run: yarn install --frozen-lockfile

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('example/yarn.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Prebuild (ios)
        working-directory: example
        run: npx expo prebuild --platform ios --no-install

      - name: Pod install
        working-directory: example/ios
        run: pod install

      - name: Build (iphonesimulator, no code signing)
        working-directory: example/ios
        run: |
          WORKSPACE="$(ls -d *.xcworkspace | head -n1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
