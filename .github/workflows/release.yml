name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack (yarn from packageManager)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Resolve tag and package version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "Tag version: $TAG"
          echo "package.json version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi

      # The native/gradle files hardcode the version by hand (see docs/VERSION-UPDATE.md).
      # Fail loudly here rather than shipping a package whose native `version`
      # constant disagrees with package.json.
      - name: Check for version drift in native files
        run: |
          VERSION="${{ steps.version.outputs.pkg }}"
          STATUS=0
          check() {
            if ! grep -qF "$2" "$1"; then
              echo "::error file=$1::Expected to find \"$2\" in $1 (version drift)."
              STATUS=1
            fi
          }
          check src/types.ts "export const VERSION = \"$VERSION\""
          check android/build.gradle "version = '$VERSION'"
          check android/build.gradle "versionName \"$VERSION\""
          check android/src/main/java/com/majornutcracker/reactnativeselectablewebview/MajornutcrackerReactNativeSelectableTextModule.kt "\"$VERSION\""
          check ios/MajornutcrackerReactNativeSelectableTextModule.swift "\"$VERSION\""
          exit $STATUS

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - run: yarn lint
      - run: yarn test
      - run: yarn typecheck

      # `prepublishOnly` (expo-module prepublishOnly) builds the package first.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
