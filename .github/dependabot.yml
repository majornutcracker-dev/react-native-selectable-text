version: 2
updates:
  # The published package's own toolchain.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      lint-and-format:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier*"
          - "*-prettier"
      testing:
        patterns:
          - "jest*"
          - "@types/jest"
          - "*-jest"
    ignore:
      # Expo/RN versions track the SDK and are bumped deliberately, not by bot.
      - dependency-name: expo
      - dependency-name: expo-module-scripts
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-native-webview

  # The example app is a test bed; keep it on the SDK cadence, not Dependabot's.
  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "expo*"
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "react-native-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
